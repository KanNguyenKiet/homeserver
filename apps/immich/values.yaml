database:
  # Dedicated native PostgreSQL cluster on the homeserver SSD. Keep this database
  # separate from the Gitea cluster because Immich expects a superuser account.
  host: 192.168.100.10
  port: 5433
  existingSecret: immich-database
  secretKeys:
    name: DB_DATABASE_NAME
    user: DB_USERNAME
    password: DB_PASSWORD

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: vault-backend
    server: http://vault.vault.svc.cluster.local:8200
    path: kv
    version: v2
  auth:
    serviceAccountName: immich-vault-auth
    mountPath: kubernetes
    role: immich
    audiences:
      - vault
  remoteRef:
    key: homeserver/immich

library:
  # The cluster already has immich-library on k3s local-path (200Gi). PVC spec fields
  # such as storageClass and volumeName are immutable once bound; do not re-apply a
  # static ZFS hostPath claim until after a deliberate migration.
  # Set create: true only after /tank/immich/library exists and the old PVC is removed.
  create: false
  persistentVolumeName: immich-library
  claimName: immich-library
  storageClass: immich-library-static
  size: 1Ti
  accessModes:
    - ReadWriteOnce
  hostPath: /tank/immich/library

immich:
  controllers:
    main:
      containers:
        main:
          image:
            tag: v3.1.0

  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich-library
    configuration:
      trash:
        enabled: true
        days: 30

  valkey:
    enabled: true
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi

  server:
    serviceMonitor:
      main:
        labels:
          release: kube-prometheus-stack
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME:
                valueFrom:
                  configMapKeyRef:
                    name: immich-database-config
                    key: DB_HOSTNAME
              DB_PORT:
                valueFrom:
                  configMapKeyRef:
                    name: immich-database-config
                    key: DB_PORT
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database
                    key: DB_DATABASE_NAME
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database
                    key: DB_USERNAME
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database
                    key: DB_PASSWORD
              DB_VECTOR_EXTENSION: vectorchord
              DB_STORAGE_TYPE: SSD
    ingress:
      main:
        enabled: true
        annotations:
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: photos.huukiet.com
            paths:
              - path: /
                service:
                  identifier: main
        tls: []

  machine-learning:
    persistence:
      cache:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
