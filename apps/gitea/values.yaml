replicaCount: 1

image:
  repository: docker.gitea.com/gitea
  tag: "1.24.7"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  http:
    port: 3000
    targetPort: 3000
  ssh:
    port: 22
    targetPort: 22

ingress:
  enabled: true
  className: nginx
  annotations:
    # Container layer uploads can be large.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  host: git.huukiet.com
  path: /
  pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClass: ""

gitea:
  rootUrl: https://git.huukiet.com
  actions:
    enabled: true
  packages:
    enabled: true
  webhook:
    allowedHostList: external,loopback
  database:
    type: postgres
    host: gitea-postgresql:5432
    existingSecret: gitea-secret
    secretKeys:
      name: DB_NAME
      user: DB_USER
      password: DB_PASS

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16.14"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    claimName: gitea-postgresql-data
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  nodeSelector:
    kubernetes.io/hostname: homeserver
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

podSecurityContext:
  fsGroup: 1000

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
