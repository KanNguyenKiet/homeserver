# Upstream woodpecker agent chart sets serviceName to woodpecker-agent but does not
# ship a governing headless Service, so the StatefulSet controller never creates pods.
apiVersion: v1
kind: Service
metadata:
  name: woodpecker-agent
  labels:
    {{- include "woodpecker-homeserver.labels" . | nindent 4 }}
    app.kubernetes.io/name: agent
    app.kubernetes.io/instance: woodpecker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: agent
    app.kubernetes.io/instance: woodpecker
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
