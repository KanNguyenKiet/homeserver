name: Build and publish wiki image

on:
  push:
    branches:
      - master
    paths:
      - apps/wiki/docs/**
      - apps/wiki/Dockerfile
      - apps/wiki/mkdocs.yml
      - apps/wiki/nginx/**
      - apps/wiki/requirements.txt
      - .gitea/workflows/wiki.yml
  workflow_dispatch:

env:
  REGISTRY_HOST: git.huukiet.com
  IMAGE: git.huukiet.com/ops/homeserver-wiki
  VALUES_FILE: apps/wiki/values.yaml
  GITHUB_REPO: KanNguyenKiet/homeserver

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          missing=()
          [[ -z "${REGISTRY_USER}" ]] && missing+=("REGISTRY_USER")
          [[ -z "${REGISTRY_TOKEN}" ]] && missing+=("REGISTRY_TOKEN")

          if ((${#missing[@]})); then
            printf 'Missing required Actions secrets: %s\n' "${missing[*]}"
            printf '%s\n' \
              'Add them under ops → Settings → Actions → Secrets:' \
              '  https://git.huukiet.com/ops/-/settings/actions/secrets' \
              '' \
              '  REGISTRY_USER   — Gitea bot username (e.g. actions-bot)' \
              '  REGISTRY_TOKEN  — PAT with read:package and write:package'
            exit 1
          fi

      # TEMPORARY: remove after fixing registry auth — prints secrets to the job log.
      - name: Debug registry secrets
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "REGISTRY_USER=${REGISTRY_USER}"
          echo "REGISTRY_TOKEN=${REGISTRY_TOKEN}"
          echo "REGISTRY_USER length: ${#REGISTRY_USER}"
          echo "REGISTRY_TOKEN length: ${#REGISTRY_TOKEN}"
          printf 'REGISTRY_USER quoted: %q\n' "${REGISTRY_USER}"
          printf 'REGISTRY_TOKEN quoted: %q\n' "${REGISTRY_TOKEN}"

      - name: Log in to Gitea registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          REGISTRY_USER="$(printf '%s' "${REGISTRY_USER}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          REGISTRY_TOKEN="$(printf '%s' "${REGISTRY_TOKEN}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "${REGISTRY_USER}:${REGISTRY_TOKEN}" \
            "https://${{ env.REGISTRY_HOST }}/v2/")"
          if [[ "${http_code}" != "200" ]]; then
            printf 'Registry auth check failed (HTTP %s).\n' "${http_code}"
            printf '%s\n' \
              'Verify org secrets at https://git.huukiet.com/ops/-/settings/actions/secrets:' \
              '  REGISTRY_USER  — exact Gitea username that owns the PAT' \
              '  REGISTRY_TOKEN — PAT with read:package and write:package (not the runner token)' \
              'Do not use your account password; create a new PAT if scopes were wrong.'
            exit 1
          fi

          printf '%s' "${REGISTRY_TOKEN}" | docker login "${{ env.REGISTRY_HOST }}" \
            -u "${REGISTRY_USER}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t "${{ env.IMAGE }}:${{ gitea.sha }}" apps/wiki
          docker push "${{ env.IMAGE }}:${{ gitea.sha }}"

      - name: Update image tag in Git
        run: |
          git config user.name "actions-bot"
          git config user.email "actions-bot@localhost"
          sed -i "s/^  tag: .*/  tag: ${{ gitea.sha }}/" "${{ env.VALUES_FILE }}"
          git add "${{ env.VALUES_FILE }}"
          git diff --staged --quiet && exit 0
          git commit -m "Update wiki image tag to ${{ gitea.sha }}"

      - name: Push to GitHub for Argo CD
        env:
          GITHUB_PUSH_TOKEN: ${{ secrets.GITHUB_PUSH_TOKEN }}
        run: |
          if [[ -z "${GITHUB_PUSH_TOKEN}" ]]; then
            printf 'Skipping GitHub push: GITHUB_PUSH_TOKEN is not configured\n'
            exit 0
          fi
          git push "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/${{ env.GITHUB_REPO }}.git" HEAD:master

      - name: Push to Gitea mirror
        run: |
          git push "https://oauth2:${{ gitea.token }}@${{ env.REGISTRY_HOST }}/${{ gitea.repository }}.git" HEAD:master
